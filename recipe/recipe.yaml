schema_version: 1

context:
  version: "10.2"

package:
  name: wcmatch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wcmatch/wcmatch-${{ version }}.tar.gz
  sha256: 92204839e3e9c945e1e71d7e1e4edeab2601ed50a5c51ff4f3f97ca711eeb738

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=0.21.1
    - pip
  run:
    - python >=${{ python_min }}
    - bracex >=2.1.1

tests:
  - python:
      imports:
        - wcmatch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Wildcard/glob file name matcher.
  license: MIT
  license_file: LICENSE.md
  homepage: https://github.com/facelessuser/wcmatch

extra:
  recipe-maintainers:
    - asford
    - ocefpaf
